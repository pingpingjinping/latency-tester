name: Static checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app.js
      - run: node --check protocol.mjs
      - run: node --check measurement.mjs
      - run: node --check calibration.mjs
      - run: node --check input-timing.mjs
      - run: node --check rev3-protocol.mjs
      - run: node --check rev3-diagnostics.mjs
      - run: node --check contact-order.mjs
      - run: node --check usb-descriptors.mjs
      - run: node --check keyboard.mjs
      - run: node --check server.mjs
      - run: node --check ptg/assets/index-BZEgvNeM.js
      - run: node --check ptg/assets/index-B3lzit8o.js
      - run: node --test tests/*.test.mjs
